app = "voiceemo-studio"        # change to a unique name
primary_region = "iad"

[build]

[env]
  PORT = "8000"
  PREVIEW_LINES = "40"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "voiceemo_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

services:
  - type: web
    name: voiceemo-studio
    runtime: docker
    plan: starter            # a disk requires a paid plan
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 5
    envVars:
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SITE_PASSWORD
        sync: false
      - key: MAX_EXPORT_CHARS
        value: "300000"
